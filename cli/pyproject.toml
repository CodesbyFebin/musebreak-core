[project]
name = "musebreak-cli"
version = "1.0.0"
description = "MuseBreak operator console — Zero-Trust command center + sandboxed agent swarm"
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "pyyaml>=6",
  "httpx>=0.27",
  "cryptography>=42",
]
license = { text = "MIT" }

[project.scripts]
musebreak = "musebreak_cli.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["musebreak_cli"]
