# MuseBreak reference run config for Llama Stack / OGX (open-weight Meta models).
#
# Schema based on the upstream ollama run-with-safety template
# (meta-llama/llama-stack …/templates/ollama/run-with-safety.yaml).
# The compose service uses ogxai/distribution-starter which is primarily **env-driven**;
# mount this file for documentation / custom `--config` builds. Field names may differ
# slightly across OGX versions — treat HF ids below as the source of truth.
#
# Verified Hugging Face ids (HTTP 200 on 2026-10-26):
#   inference : meta-llama/Llama-3.3-70B-Instruct
#   safety    : meta-llama/Llama-Guard-3-8B
#   vision    : meta-llama/Llama-3.2-11B-Vision-Instruct
#               (also: meta-llama/Llama-3.2-11B-Vision base)
# Ollama pull aliases (when using remote::ollama):
#   llama3.3:70b , llama-guard3:8b , llama3.2-vision

version: "2"
image_name: musebreak-open
docker_image: null

apis:
  - agents
  - datasetio
  - eval
  - inference
  - memory          # older name; newer OGX may use vector_io
  - safety
  - scoring
  - telemetry

providers:
  inference:
    - provider_id: ollama
      provider_type: remote::ollama
      config:
        url: ${env.OLLAMA_URL:http://ollama:11434}
  # "memory" / vector store
  memory:
    - provider_id: faiss
      provider_type: inline::faiss
      config:
        kvstore:
          type: sqlite
          namespace: null
          db_path: ${env.SQLITE_STORE_DIR:~/.llama/distributions/musebreak}/faiss_store.db
  safety:
    - provider_id: llama-guard
      provider_type: inline::llama-guard
      config: {}
  agents:
    - provider_id: meta-reference
      provider_type: inline::meta-reference
      config:
        persistence_store:
          type: sqlite
          namespace: null
          db_path: ${env.SQLITE_STORE_DIR:~/.llama/distributions/musebreak}/agents_store.db
  telemetry:
    - provider_id: meta-reference
      provider_type: inline::meta-reference
      config:
        service_name: ${env.OTEL_SERVICE_NAME:musebreak-llama-stack}
        sinks: ${env.TELEMETRY_SINKS:console,sqlite}
        sqlite_db_path: ${env.SQLITE_DB_PATH:~/.llama/distributions/musebreak/trace_store.db}
  eval:
    - provider_id: meta-reference
      provider_type: inline::meta-reference
      config: {}
  datasetio:
    - provider_id: huggingface
      provider_type: remote::huggingface
      config: {}
    - provider_id: localfs
      provider_type: inline::localfs
      config: {}
  scoring:
    - provider_id: basic
      provider_type: inline::basic
      config: {}

metadata_store:
  namespace: null
  type: sqlite
  db_path: ${env.SQLITE_STORE_DIR:~/.llama/distributions/musebreak}/registry.db

models:
  # Primary chat / orchestration (Muse Wonderful open equivalent)
  - metadata:
      musebreak_role: orchestrator
      hf_id: meta-llama/Llama-3.3-70B-Instruct
    model_id: ${env.INFERENCE_MODEL:meta-llama/Llama-3.3-70B-Instruct}
    provider_id: ollama
    provider_model_id: null
  # Safety / Llama Guard
  - metadata:
      musebreak_role: guard
      hf_id: meta-llama/Llama-Guard-3-8B
    model_id: ${env.SAFETY_MODEL:meta-llama/Llama-Guard-3-8B}
    provider_id: ollama
    provider_model_id: null
  # Vision (multimodal) — requires a vision-capable Ollama tag or a vLLM vision backend.
  # Declared here for routing docs; may not load on CPU-only Ollama without llama3.2-vision.
  - metadata:
      musebreak_role: vision
      hf_id: meta-llama/Llama-3.2-11B-Vision-Instruct
    model_id: ${env.VISION_MODEL:meta-llama/Llama-3.2-11B-Vision-Instruct}
    provider_id: ollama
    provider_model_id: null

shields:
  - params: null
    shield_id: ${env.SAFETY_MODEL:meta-llama/Llama-Guard-3-8B}
    provider_id: null
    provider_shield_id: null

memory_banks: []
datasets: []
scoring_fns: []
eval_tasks: []
